name: littafin_wakoki
description: A Christian Hymn Book in Hausa

publish_to: 'none'

version: 1.0.7+9

environment:
  sdk: ">=2.17.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.4
  shared_preferences: ^2.0.13
  http: ^1.2.0
  path_provider: ^2.0.9
  url_launcher: ^6.0.20
  flutter_email_sender: ^5.1.0
  sqflite: 2.4.1
  sqflite_common_ffi: ^2.3.4+4
  draggable_scrollbar: ^0.1.0
  audioplayers: ^5.2.1
  firebase_remote_config: ^3.0.10
  flutter_inappwebview: ^6.0.0
  clipboard: ^0.1.3
  firebase_analytics: ^10.1.1
  firebase_core: ^2.5.0
  google_mobile_ads: ^9.1.0
  in_app_update: ^4.0.1
  share_plus: ^13.3.0
  wakelock_plus: ^1.8.0
  in_app_purchase: ^3.3.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: any
  flutter_native_splash: ^2.1.2
  flutter_lints: ^2.0.0

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "images/main_icon.png"
  adaptive_icon_background: "#ffffff"

flutter_native_splash:
  # Full-screen artwork for Android 11 and below, iOS, and web.
  color: "#0FC40F"
  background_image: images/splash.png

  # Android 12+ only allows a centered icon on a solid color.
  android_12:
    image: images/splash_android12.png
    color: "#0FC40F"

flutter:
  uses-material-design: true
  assets:
    - images/
    - tunes/
